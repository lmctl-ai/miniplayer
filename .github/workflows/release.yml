name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v2.0.0); if empty, auto-computed as next patch"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: install dependencies
        run: npm ci
      - name: run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: determine release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          manual_tag="${{ inputs.release_tag }}"
          if [ -n "$manual_tag" ]; then
            tag="$manual_tag"
          else
            tag=$(python3 - <<'PY'
          import json, re, subprocess
          pkg = json.load(open('package.json'))
          pkg_ver = pkg.get('version', '0.0.0')
          m = re.match(r'^(\d+)\.(\d+)(?:\.(\d+))?$', pkg_ver)
          major, minor = m.group(1), m.group(2)
          target_patch = int(m.group(3) or '0')

          res = subprocess.run(['git', 'tag', '-l', f'v{major}.{minor}.*'], capture_output=True, text=True)
          tags = res.stdout.strip().split()
          patches = []
          for t in tags:
              tm = re.fullmatch(rf'v{major}\.{minor}\.(\d+)', t)
              if tm:
                  patches.append(int(tm.group(1)))

          if not patches:
              tag = f"v{major}.{minor}.{target_patch}"
          else:
              tag = f"v{major}.{minor}.{max(patches) + 1}"
          print(tag)
          PY
          )
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"
      - name: install dependencies
        run: npm ci
      - name: compile standalone executables
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/build-bun.mjs --outdir dist
      - name: verify linux-x64 binary smoke
        run: |
          set -euo pipefail
          ./dist/miniplayer-linux-x64 --version
          ./dist/miniplayer-linux-x64 --help
          echo "smoke test" | ./dist/miniplayer-linux-x64 run -m mock/Echo
      - name: bundle licenses and update checksums
        run: |
          set -euo pipefail
          cp LICENSE dist/
          cp THIRD_PARTY_NOTICES* dist/ 2>/dev/null || true
          (cd dist && find . -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: release-artifacts
      - name: assemble and publish public prerelease
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$RELEASE_TAG"

          # Verify tag matches vMAJOR.MINOR.PATCH
          python3 -c 'import re, sys; sys.exit(0 if re.fullmatch(r"v\d+\.\d+\.\d+", sys.argv[1]) else f"Invalid tag format: {sys.argv[1]}")' "$RELEASE_TAG"

          # Verify required artifacts exist
          expected="miniplayer-linux-x64 miniplayer-linux-arm64 miniplayer-darwin-arm64 miniplayer-darwin-x64 miniplayer-windows-x64.exe SHA256SUMS LICENSE"
          for name in $expected; do
            test -f "release-artifacts/$name" || { echo "Missing required asset: $name" >&2; exit 1; }
          done

          # Verify checksums integrity
          (cd release-artifacts && sha256sum -c SHA256SUMS)

          boundary=$(awk 'BEGIN{p=1} p && NF{print} !NF{p=0}' LICENSE)
          printf 'private-run-id: %s\n\n%s\n\nStandalone cross-platform Bun executables for miniplayer.\n' "$GITHUB_RUN_ID" "$boundary" > release-notes.md

          gh release create "$RELEASE_TAG" \
            --target main \
            --title "$RELEASE_TAG" \
            --prerelease \
            --latest=false \
            --notes-file release-notes.md \
            release-artifacts/*
