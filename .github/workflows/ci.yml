name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  gate:
    name: CI gate
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: List and require every leg
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_LEGS: '["ubuntu-latest / Node 20", "ubuntu-latest / Node 22", "ubuntu-24.04-arm / Node 20", "ubuntu-24.04-arm / Node 22", "macos-latest / Node 20", "macos-latest / Node 22", "macos-15-intel / Node 20", "macos-15-intel / Node 22", "windows-latest / Node 20", "windows-latest / Node 22"]'
        run: python3 scripts/ci-gate.py
