name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux-x64-20:
    name: ubuntu-latest / Node 20
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/node-leg.yml
    with:
      runner: ubuntu-latest
      node-version: "20"

  linux-x64-22:
    name: ubuntu-latest / Node 22
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/node-leg.yml
    with:
      runner: ubuntu-latest
      node-version: "22"

  linux-arm-20:
    name: ubuntu-24.04-arm / Node 20
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/node-leg.yml
    with:
      runner: ubuntu-24.04-arm
      node-version: "20"

  linux-arm-22:
    name: ubuntu-24.04-arm / Node 22
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/node-leg.yml
    with:
      runner: ubuntu-24.04-arm
      node-version: "22"

  macos-arm-20:
    name: macos-latest / Node 20
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/node-leg.yml
    with:
      runner: macos-latest
      node-version: "20"

  macos-arm-22:
    name: macos-latest / Node 22
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/node-leg.yml
    with:
      runner: macos-latest
      node-version: "22"

  macos-intel-20:
    name: macos-15-intel / Node 20
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/node-leg.yml
    with:
      runner: macos-15-intel
      node-version: "20"

  macos-intel-22:
    name: macos-15-intel / Node 22
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/node-leg.yml
    with:
      runner: macos-15-intel
      node-version: "22"

  windows-20:
    name: windows-latest / Node 20
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/node-leg.yml
    with:
      runner: windows-latest
      node-version: "20"

  windows-22:
    name: windows-latest / Node 22
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/node-leg.yml
    with:
      runner: windows-latest
      node-version: "22"

  gate:
    name: CI gate
    needs: [linux-x64-20, linux-x64-22, linux-arm-20, linux-arm-22, macos-arm-20, macos-arm-22, macos-intel-20, macos-intel-22, windows-20, windows-22]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Test the fail-closed gate
        run: python3 scripts/test-ci-gate.py
      - name: List and require every leg
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_LEGS: '{"linux-x64-20": "ubuntu-latest / Node 20", "linux-x64-22": "ubuntu-latest / Node 22", "linux-arm-20": "ubuntu-24.04-arm / Node 20", "linux-arm-22": "ubuntu-24.04-arm / Node 22", "macos-arm-20": "macos-latest / Node 20", "macos-arm-22": "macos-latest / Node 22", "macos-intel-20": "macos-15-intel / Node 20", "macos-intel-22": "macos-15-intel / Node 22", "windows-20": "windows-latest / Node 20", "windows-22": "windows-latest / Node 22"}'
        run: python3 scripts/ci-gate.py
